name: 0 · Auto Setup (zip → live site)

# ============================================================================
#  जनमत — एक ही Action सब कुछ कर देता है:
#   1) repo में पड़ी ZIP को खोलता है और प्रोजेक्ट root में लगा देता है
#   2) index.html build करता है
#   3) 15 smoke tests चलाता है (असली सर्वर पर)
#   4) GitHub Pages अपने आप चालू करके site deploy कर देता है
#   5) Render का one-click deploy link summary में दिखा देता है
#
#  आपको सिर्फ़ 2 काम:
#   (क) repo में janmat-upload.zip upload करें
#   (ख) यह फ़ाइल .github/workflows/0-setup.yml नाम से बनाएँ (paste)
# ============================================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write     # zip खोलकर commit करने के लिए
  pages: write        # Pages चालू करने / deploy करने के लिए
  id-token: write     # Pages deploy के लिए ज़रूरी

concurrency:
  group: janmat-autosetup
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1) ZIP खोलो → build → test → commit
  # --------------------------------------------------------------------------
  setup:
    name: ZIP खोलो और साइट बनाओ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      built: ${{ steps.unpack.outputs.found }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 ZIP खोलकर प्रोजेक्ट root में लगाओ
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            if [ -f server.js ] || [ -f index.html ]; then
              echo "ℹ️ कोई ZIP नहीं — प्रोजेक्ट पहले से मौजूद है, आगे बढ़ते हैं।"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ न ZIP मिली, न server.js/index.html — कुछ नहीं कर सकते।"
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          rm -rf /tmp/jx && mkdir -p /tmp/jx
          for z in "${zips[@]}"; do
            echo "📦 खोल रहे हैं: $z"
            unzip -q -o "$z" -d "/tmp/jx/${z%.zip}"
          done

          # अगर repo में एक से ज़्यादा zip हैं (जैसे पुरानी janmat-v2.zip भी पड़ी हो),
          # तो सबसे पूरा/नया प्रोजेक्ट चुनो — स्कोर: server.js + build.js + api-base.js
          src=""; best=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            d="$(dirname "$f")"
            score=0
            [ -f "$d/server.js" ]   && score=$((score + 1))
            [ -f "$d/build.js" ]    && score=$((score + 2))
            [ -f "$d/api-base.js" ] && score=$((score + 4))
            [ -f "$d/index.html" ]  && score=$((score + 1))
            if [ "$score" -gt "$best" ]; then best="$score"; src="$d"; fi
          done < <(find /tmp/jx -maxdepth 5 \( -name server.js -o -name index.html \) -print 2>/dev/null)

          if [ -z "$src" ]; then
            echo "❌ ZIP के अंदर server.js/index.html नहीं मिला — कृपया सही zip upload करें।"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ सोर्स फ़ोल्डर: $src (स्कोर $best)"
          if [ ${#zips[@]} -gt 1 ]; then
            echo "ℹ️ ${#zips[@]} zip मिलीं — सबसे नया/पूरा प्रोजेक्ट चुना गया।"
          fi

          # सारी चीज़ें root में copy (छिपी फ़ाइलें भी)
          shopt -s dotglob
          cp -R "$src"/. .
          shopt -u dotglob

          # zip फ़ाइलें हटाओ (अब ज़रूरत नहीं)
          for z in "${zips[@]}"; do rm -f "$z"; done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build (index.html) + server URL inject
        if: steps.unpack.outputs.found == 'true'
        shell: bash
        env:
          # GitHub → Settings → Variables → API_BASE  (Render URL डालने पर
          # github.io वाली साइट भी उसी साझा सर्वर से डेटा लेगी)
          JANMAT_API_BASE: ${{ vars.API_BASE }}
        run: |
          set -euo pipefail
          if [ -f build.js ]; then node build.js; else echo "build.js नहीं मिला — skip"; fi
          ls -lh index.html 2>/dev/null || true

      - name: 🧪 Smoke test (asli server + 15 checks)
        if: steps.unpack.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        env:
          DEV_PASSWORD: ${{ vars.DEV_PASSWORD || 'KHOHDEEG' }}
        run: |
          if [ -f .github/scripts/smoke.sh ]; then
            chmod +x .github/scripts/*.sh
            PORT=3000 bash .github/scripts/smoke.sh
          else
            echo "smoke.sh नहीं मिला — skip"
          fi

      - name: 💾 बदलाव commit + push
        if: steps.unpack.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/db.json
          git config user.name  "janmat-bot"
          git config user.email "janmat-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ कुछ बदलने की ज़रूरत नहीं — सब पहले से ठीक है।"
          else
            git commit -m "chore(auto): unzip + build by GitHub Action"
            git push
            echo "✅ बदलाव push हो गए।"
          fi

  # --------------------------------------------------------------------------
  # 2) GitHub Pages चालू करो और deploy करो
  # --------------------------------------------------------------------------
  deploy:
    name: GitHub Pages deploy
    needs: setup
    if: needs.setup.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 🔧 Pages चालू करो (पहली बार अपने आप)
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 🔁 Pages का स्रोत = GitHub Actions (पहले से चालू हो तो भी ठीक)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 \
          || gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 \
          || echo "ℹ️ Pages स्रोत पहले से सेट है — जारी रखते हैं"

      - name: 📁 deploy फ़ोल्डर तैयार करो
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          for f in index.html config.js api-base.js .nojekyll; do
            [ -e "$f" ] && cp "$f" _site/ || true
          done
          if [ ! -f _site/index.html ] && [ -f build.js ]; then
            node build.js && cp index.html _site/ || true
          fi
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  # --------------------------------------------------------------------------
  # 3) आख़िर में साफ़ निर्देश + Render का link
  # --------------------------------------------------------------------------
  summary:
    name: अगले कदम (Render)
    needs: [setup]
    if: needs.setup.outputs.built == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Summary
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            PAGES="https://${OWNER}.github.io/"
          else
            PAGES="https://${OWNER}.github.io/${NAME}/"
          fi
          {
            echo "## ✅ साइट तैयार है"
            echo ""
            echo "### 🌐 आपकी साइट (GitHub Pages)"
            echo ""
            echo "**${PAGES}**"
            echo ""
            echo "> पहली बार खुलने में 1–2 मिनट लग सकते हैं।"
            echo ""
            echo "---"
            echo ""
            echo "### 🗳️ अब असली साझा वोटिंग चालू करें (सिर्फ़ 2 कदम)"
            echo ""
            echo "**कदम 1 — Render पर एक क्लिक:**"
            echo ""
            echo "👉 [Render पर Deploy करें](https://render.com/deploy?repo=https://github.com/${REPO})"
            echo ""
            echo '```'
            echo "https://render.com/deploy?repo=https://github.com/${REPO}"
            echo '```'
            echo ""
            echo "Render में **GitHub से login** → **Apply** दबाएँ (कार्ड नहीं चाहिए)।"
            echo "2–3 मिनट में URL मिलेगा, जैसे \`https://janmat-xxxx.onrender.com\`"
            echo ""
            echo "**कदम 2 — वह URL यहाँ डालें (एक बार):**"
            echo ""
            echo "**Settings → Secrets and variables → Actions → Variables → New repository variable**"
            echo ""
            echo "| Name | Value |"
            echo "|---|---|"
            echo "| \`API_BASE\` | \`https://janmat-xxxx.onrender.com\` |"
            echo ""
            echo "फिर **Actions → 0 · Auto Setup → Run workflow** दबाएँ।"
            echo "अब ${PAGES} भी उसी साझा सर्वर से चलेगी — सबको एक ही चुनाव दिखेगा।"
            echo ""
            echo "---"
            echo ""
            echo "### 🔔 (ज़रूरी नहीं) Render को जगाए रखना"
            echo ""
            echo "एक और variable जोड़ें: \`SITE_URL\` = आपका Render URL —"
            echo "हर 14 मिनट में अपने आप जगता रहेगा (\`.github/workflows/2-keepalive.yml\`)।"
            echo ""
            echo "### 🔑 डेवलपर पैनल"
            echo ""
            echo "\`${PAGES}#/developer\` · पासवर्ड: \`${{ vars.DEV_PASSWORD || 'KHOHDEEG' }}\`"
            echo ""
            echo "> पासवर्ड बदलने के लिए repo variable \`DEV_PASSWORD\` सेट करें।"
          } >> "$GITHUB_STEP_SUMMARY"

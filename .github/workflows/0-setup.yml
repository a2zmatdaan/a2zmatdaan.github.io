name: 0 · Auto Setup (zip → live site)

# ============================================================================
#  जनमत — v2 (FIXED) : पिछली बार यही step fail हुआ था → "commit + push"
#
#  क्यों fail हुआ था?
#   ZIP के अंदर .github/workflows/0-setup.yml का नया version भी था। commit में
#   workflow फ़ाइल बदलने की कोशिश हुई, और token के पास `workflows: write`
#   permission नहीं थी → GitHub ने push reject कर दिया।
#
#  अब क्या ठीक किया:
#   1) commit में .github/workflows को छुआ ही नहीं जाता (आपका workflow सुरक्षित)
#      → push कभी reject नहीं होगा (workflow फ़ाइल बदलने की समस्या ही खत्म)
#   3) push fail हो तो भी साइट live हो जाती है (Pages artifact से deploy)
#   4) push fail हो तो असली error summary में दिखता है + पूरा प्रोजेक्ट
#      `janmat-project.zip` artifact के रूप में download के लिए तैयार रहता है
# ============================================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write     # zip खोलकर commit करने के लिए
  pages: write        # Pages deploy के लिए
  id-token: write

concurrency:
  group: janmat-autosetup
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1) ZIP खोलो → build → test → commit
  # --------------------------------------------------------------------------
  setup:
    name: ZIP खोलो और साइट बनाओ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      built: ${{ steps.unpack.outputs.found }}
      pushed: ${{ steps.push.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 ZIP खोलकर प्रोजेक्ट root में लगाओ
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            if [ -f server.js ] || [ -f index.html ]; then
              echo "ℹ️ कोई ZIP नहीं — प्रोजेक्ट पहले से मौजूद है, आगे बढ़ते हैं।"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ न ZIP मिली, न server.js/index.html — कुछ नहीं कर सकते।"
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          rm -rf /tmp/jx && mkdir -p /tmp/jx
          for z in "${zips[@]}"; do
            echo "📦 खोल रहे हैं: $z"
            unzip -q -o "$z" -d "/tmp/jx/${z%.zip}"
          done

          # एक से ज़्यादा zip हों (पुरानी janmat-v2.zip भी पड़ी हो) तो सबसे पूरा चुनो
          src=""; best=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            d="$(dirname "$f")"
            score=0
            [ -f "$d/server.js" ]   && score=$((score + 1))
            [ -f "$d/build.js" ]    && score=$((score + 2))
            [ -f "$d/api-base.js" ] && score=$((score + 4))
            [ -f "$d/index.html" ]  && score=$((score + 1))
            if [ "$score" -gt "$best" ]; then best="$score"; src="$d"; fi
          done < <(find /tmp/jx -maxdepth 5 \( -name server.js -o -name index.html \) -print 2>/dev/null)

          if [ -z "$src" ]; then
            echo "❌ ZIP के अंदर server.js/index.html नहीं मिला — कृपया सही zip upload करें।"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ सोर्स फ़ोल्डर: $src (स्कोर $best)"

          shopt -s dotglob
          cp -R "$src"/. .
          shopt -u dotglob

          for z in "${zips[@]}"; do rm -f "$z"; done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: 🛡️ आपकी workflow फ़ाइलें वापस जैसी थीं (overwrite नहीं)
        if: steps.unpack.outputs.found == 'true'
        shell: bash
        run: |
          # ZIP में जो .github/workflows आया, उसे अनदेखा करके repo वाला रखो
          if [ -d .github/workflows ]; then
            git checkout -- .github/workflows 2>/dev/null || true
            git clean -fdq .github/workflows 2>/dev/null || true
          fi
          ls -1 .github/workflows || true

      - name: 🏗️ Build (index.html) + server URL inject
        if: steps.unpack.outputs.found == 'true'
        shell: bash
        env:
          JANMAT_API_BASE: ${{ vars.API_BASE }}
        run: |
          set -euo pipefail
          if [ -f build.js ]; then node build.js; else echo "build.js नहीं मिला — skip"; fi
          ls -lh index.html 2>/dev/null || true
          echo "--- api-base.js ---"; cat api-base.js 2>/dev/null || true

      - name: 🧪 Smoke test (asli server + 15 checks)
        if: steps.unpack.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        env:
          DEV_PASSWORD: ${{ vars.DEV_PASSWORD || 'KHOHDEEG' }}
        run: |
          if [ -f .github/scripts/smoke.sh ]; then
            chmod +x .github/scripts/*.sh
            PORT=3000 bash .github/scripts/smoke.sh
          else
            echo "smoke.sh नहीं मिला — skip"
          fi

      - name: 📁 Pages के लिए deploy फ़ोल्डर
        if: steps.unpack.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          for f in index.html config.js api-base.js .nojekyll; do
            [ -e "$f" ] && cp "$f" _site/ || true
          done
          ls -lh _site

      - name: ⬆️ Pages artifact
        if: steps.unpack.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 💾 बदलाव commit + push
        id: push
        if: steps.unpack.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          rm -f data/db.json
          git config user.name  "janmat-bot"
          git config user.email "janmat-bot@users.noreply.github.com"
          git config core.fileMode false   # सिर्फ़ परमिशन बदलने से फ़र्ज़ी commit न बने

          # ⚠️ .github/workflows और _site (build artifact) commit से बाहर
          if ! git add -A -- . ':(exclude).github/workflows' ':(exclude)_site'; then
            echo "❌ git add fail हुआ — कुछ भी commit नहीं हुआ"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "✅ कुछ बदलने की ज़रूरत नहीं — सब पहले से repo में है।"
            exit 0
          fi

          git commit -m "chore(auto): unzip + build by GitHub Action"

          if git push; then
            echo "✅ Push हो गया — repo में पूरा प्रोजेक्ट आ गया।"
            exit 0
          fi

          # कभी-कभी remote आगे होता है — rebase करके एक बार फिर
          echo "↻ पहला push नहीं लगा — pull --rebase करके दोबारा कोशिश…"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          if git push; then
            echo "✅ दूसरी कोशिश में push हो गया।"
            exit 0
          fi

          echo "❌ Push नहीं हो पाया — कारण नीचे है:"
          git push 2>&1 | tail -20 | tee push_error.txt || true
          exit 1

      - name: 🧰 (fallback) पूरा प्रोजेक्ट zip में — manual upload के लिए
        if: steps.unpack.outputs.found == 'true' && steps.push.outcome == 'failure'
        shell: bash
        run: |
          rm -f /tmp/janmat-project.zip
          zip -qr /tmp/janmat-project.zip . -x ".git/*" -x "*.DS_Store" -x "data/db.json" -x "_site/*" || true
          ls -lh /tmp/janmat-project.zip

      - name: ⬆️ (fallback) artifact upload
        if: steps.unpack.outputs.found == 'true' && steps.push.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: janmat-project
          path: /tmp/janmat-project.zip
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2) GitHub Pages deploy (push fail होने पर भी साइट live हो जाए)
  # --------------------------------------------------------------------------
  deploy:
    name: GitHub Pages deploy
    needs: setup
    if: needs.setup.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🔧 Pages को Actions से deploy करने के लिए सेट करो
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 \
          || gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 \
          || echo "ℹ️ Pages स्रोत सेट नहीं हो सका — नीचे deploy कोशिश करेगा"

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

  # --------------------------------------------------------------------------
  # 3) हमेशा चलने वाला summary — साफ़ बताता है क्या हुआ
  # --------------------------------------------------------------------------
  summary:
    name: नतीजा और अगले कदम
    needs: [setup, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Summary
        shell: bash
        env:
          BUILT: ${{ needs.setup.outputs.built }}
          PUSHED: ${{ needs.setup.outputs.pushed }}
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%%/*}"; NAME="${REPO##*/}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            PAGES="https://${OWNER}.github.io/"
          else
            PAGES="https://${OWNER}.github.io/${NAME}/"
          fi

          {
            echo "## 📋 नतीजा"
            echo ""
            echo "| चीज़ | स्थिति |"
            echo "|---|---|"
            if [ "$BUILT" = "true" ]; then
              echo "| ZIP खुली + build | ✅ |"
            else
              echo "| ZIP खुली + build | ❌ (zip नहीं मिली या server.js/index.html नहीं था) |"
            fi
            if [ "$PUSHED" = "success" ]; then
              echo "| Repo में फ़ाइलें commit | ✅ |"
            else
              echo "| Repo में फ़ाइलें commit | ⚠️ नहीं हो पाया (साइट फिर भी live होगी) |"
            fi
            echo ""
            echo "### 🌐 आपकी साइट"
            echo ""
            echo "**${PAGES}**  ·  डेवलपर पैनल: \`${PAGES}#/developer\` (पासवर्ड \`${{ vars.DEV_PASSWORD || 'KHOHDEEG' }}\`)"
            echo ""
            echo "> पहली बार 1–2 मिनट लग सकते हैं।"
            echo ""
            if [ "$PUSHED" != "success" ]; then
              echo "---"
              echo ""
              echo "### ⚠️ Push क्यों नहीं हुआ — इसे ठीक करें (20 सेकंड)"
              echo ""
              echo "**Settings → Actions → General → Workflow permissions** →"
              echo "**\"Read and write permissions\"** चुनें → **Save** → फिर"
              echo "**Actions → 0 · Auto Setup → Run workflow**."
              echo ""
              echo "अगर फिर भी न हो, तो इस run के नीचे **janmat-project** artifact download करें —"
              echo "उस zip को repo में upload कर देने से सब चल जाएगा।"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### 🗳️ असली साझा वोटिंग चालू करें (Render)"
            echo ""
            echo "👉 [Render पर Deploy करें](https://render.com/deploy?repo=https://github.com/${REPO})"
            echo ""
            echo '```'
            echo "https://render.com/deploy?repo=https://github.com/${REPO}"
            echo '```'
            echo ""
            echo "GitHub से login → **Apply** → 2–3 मिनट में URL मिलेगा।"
            echo ""
            echo "फिर **Settings → Secrets and variables → Actions → Variables → New variable**:"
            echo ""
            echo "| Name | Value |"
            echo "|---|---|"
            echo "| \`API_BASE\` | आपका Render URL (जैसे \`https://janmat-xxxx.onrender.com\`) |"
            echo "| \`SITE_URL\` | वही URL (Render को जगाए रखने के लिए — ज़रूरी नहीं) |"
            echo ""
            echo "उसके बाद **Actions → 0 · Auto Setup → Run workflow** एक बार फिर दबाएँ।"
          } >> "$GITHUB_STEP_SUMMARY"
